version: "2"

run:
  tests: false
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (net/http.ResponseWriter).Write
        - encoding/json.Unmarshal
  exclusions:
    rules:
      - path: examples/
        linters:
          - errcheck
          - unused
